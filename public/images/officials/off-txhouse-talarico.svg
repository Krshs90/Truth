<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="450" height="550">
  <defs>
    <linearGradient id="bg-JT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow-JT" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="vignette-JT" cx="50%" cy="40%" r="60%">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>
    <clipPath id="circleClip-JT">
      <circle cx="225" cy="205" r="115" />
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="450" height="550" fill="url(#bg-JT)" />
  <rect width="450" height="550" fill="url(#glow-JT)" />
  <rect width="450" height="550" fill="url(#vignette-JT)" />

  <!-- Subtle State of Texas Geometric Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1.2" fill="none">
    <circle cx="225" cy="205" r="145" stroke-dasharray="4,6" />
    <circle cx="225" cy="205" r="125" />
    <line x1="80" y1="205" x2="370" y2="205" />
    <line x1="225" y1="60" x2="225" y2="350" />
  </g>

  <!-- Official Avatar Halo -->
  <circle cx="225" cy="205" r="118" fill="#18181b" stroke="#38bdf8" stroke-width="3" />

  <!-- Silhouette & Monogram -->
  <g clip-path="url(#circleClip-JT)">
    <circle cx="225" cy="205" r="115" fill="#111827" />
    <path d="M 125 315 C 135 245, 175 220, 225 220 C 275 220, 315 245, 325 315 Z" fill="#2563eb" opacity="0.85" />
    <circle cx="225" cy="170" r="50" fill="#f8fafc" opacity="0.92" />
    <text x="225" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#1e3a8a" text-anchor="middle" letter-spacing="2">
      JT
    </text>
  </g>

  <!-- Official Name Badge Overlay -->
  <g transform="translate(35, 365)">
    <rect width="380" height="145" rx="16" fill="#0b0f19" fill-opacity="0.94" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="8" height="145" rx="4" fill="#38bdf8" />
    <text x="26" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
      James Talarico
    </text>
    <text x="26" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      Texas State Representative
    </text>
    <text x="26" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">
      District 50 (Travis & Williamson)
    </text>
    <text x="26" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
      VERIFIED PUBLIC OFFICIAL • TEXAS
    </text>
  </g>
</svg>